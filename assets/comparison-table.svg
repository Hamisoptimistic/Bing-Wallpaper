<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background: #0d1117; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Card & Glow Gradients -->
    <linearGradient id="winner-col" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#238636" stop-opacity="0.05" />
    </linearGradient>
    
    <linearGradient id="winner-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#2ea44f" />
    </linearGradient>

    <!-- Row Hover/Alternate Effect -->
    <linearGradient id="row-even" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glass Overlay -->
    <filter id="blur-bg">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>

  <style>
    .title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; fill: #8b949e; }
    .header-text { font-size: 14px; font-weight: 700; fill: #f0f6fc; }
    .winner-header-text { font-size: 15px; font-weight: 800; fill: #ffffff; letter-spacing: 0.5px; }
    .cell-label { font-size: 13px; font-weight: 600; fill: #c9d1d9; }
    .cell-value { font-size: 12.5px; fill: #8b949e; }
    .cell-winner { font-size: 12.5px; font-weight: 700; fill: #3fb950; }
    .cell-bad { font-size: 12.5px; fill: #f85149; }
    .grid-line { stroke: #30363d; stroke-width: 1; stroke-opacity: 0.5; }
    .badge { rx: 4px; ry: 4px; }
  </style>

  <!-- Table Container Background -->
  <rect x="20" y="20" width="920" height="580" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Winner Column Highlight Background -->
  <rect x="250" y="20" width="230" height="580" fill="url(#winner-col)" rx="0"/>

  <!-- Header Backgrounds -->
  <path d="M 20 32 C 20 25.37 25.37 20 32 20 L 250 20 L 250 75 L 20 75 Z" fill="#161b22" />
  <rect x="250" y="20" width="230" height="55" fill="url(#winner-header)" rx="0"/>
  <!-- Top corners rounding for winner header -->
  <rect x="250" y="20" width="230" height="10" fill="url(#winner-header)"/>
  <path d="M 480 20 L 710 20 L 710 75 L 480 75 Z" fill="#161b22" />
  <path d="M 710 20 L 928 20 C 934.63 20 940 25.37 940 32 L 940 75 L 710 75 Z" fill="#161b22" />

  <!-- Column Headers -->
  <text x="40" y="52" class="title">Feature</text>
  <text x="365" y="52" text-anchor="middle" class="winner-header-text">★ Bing Wallpaper</text>
  <text x="595" y="52" text-anchor="middle" class="header-text">Official Bing Wallpaper</text>
  <text x="825" y="52" text-anchor="middle" class="header-text">Electron / WebView Apps</text>

  <!-- Row Alternating Backgrounds -->
  <g id="row-backgrounds">
    <rect x="20" y="120" width="920" height="45" fill="url(#row-even)"/>
    <rect x="20" y="210" width="920" height="45" fill="url(#row-even)"/>
    <rect x="20" y="300" width="920" height="45" fill="url(#row-even)"/>
    <rect x="20" y="390" width="920" height="45" fill="url(#row-even)"/>
    <rect x="20" y="480" width="920" height="45" fill="url(#row-even)"/>
  </g>

  <!-- Horizontal Dividers -->
  <g class="grid-line">
    <line x1="20" y1="75" x2="940" y2="75" stroke="#30363d" stroke-width="2" />
    <line x1="20" y1="120" x2="940" y2="120" />
    <line x1="20" y1="165" x2="940" y2="165" />
    <line x1="20" y1="210" x2="940" y2="210" />
    <line x1="20" y1="255" x2="940" y2="255" />
    <line x1="20" y1="300" x2="940" y2="300" />
    <line x1="20" y1="345" x2="940" y2="345" />
    <line x1="20" y1="390" x2="940" y2="390" />
    <line x1="20" y1="435" x2="940" y2="435" />
    <line x1="20" y1="480" x2="940" y2="480" />
    <line x1="20" y1="525" x2="940" y2="525" />
    <line x1="20" y1="570" x2="940" y2="570" />
  </g>

  <!-- Vertical Column Lines -->
  <g class="grid-line">
    <line x1="250" y1="20" x2="250" y2="600" stroke="#2ea44f" stroke-opacity="0.4" stroke-width="1.5" />
    <line x1="480" y1="20" x2="480" y2="600" stroke="#2ea44f" stroke-opacity="0.4" stroke-width="1.5" />
    <line x1="710" y1="20" x2="710" y2="600" />
  </g>

  <!-- Row 1: Active Memory -->
  <text x="40" y="102" class="cell-label">Active Memory (RAM)</text>
  <g>
    <defs>
      <linearGradient id="special-glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#2ea44f" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#238636" stop-opacity="0.3" />
      </linearGradient>
      <style>
        @keyframes pulse-special {
          0% { opacity: 0.7; filter: drop-shadow(0 0 2px #3fb950); }
          50% { opacity: 1.0; filter: drop-shadow(0 0 8px #3fb950); }
          100% { opacity: 0.7; filter: drop-shadow(0 0 2px #3fb950); }
        }
        .special-badge-glow {
          animation: pulse-special 2s infinite ease-in-out;
        }
      </style>
    </defs>

    <rect 
      x="300" 
      y="86" 
      width="130" 
      height="24" 
      rx="6" 
      ry="6" 
      class="badge special-badge-glow" 
      fill="url(#special-glow-grad)" 
      stroke="#3fb950" 
      stroke-width="1.5" 
    />
  </g>
  <text x="365" y="102" text-anchor="middle" class="cell-winner">~50–60 MB</text>
  <text x="595" y="102" text-anchor="middle" class="cell-value">~80–120 MB</text>
  <text x="825" y="102" text-anchor="middle" class="cell-value">~200 MB – 400 MB</text>

  <!-- Row 2: Idle Memory -->
  <text x="40" y="147" class="cell-label">Idle Memory (Closed)</text>
  <rect x="275" y="131" width="180" height="24" class="badge" fill="#238636" fill-opacity="0.25"/>
  <text x="365" y="147" text-anchor="middle" class="cell-winner">0 MB (Zero Resident)</text>
  <text x="595" y="147" text-anchor="middle" class="cell-value">~80 MB (Resident)</text>
  <text x="825" y="147" text-anchor="middle" class="cell-value">~200–400 MB (Resident)</text>

  <!-- Row 3: 4K / UHD -->
  <text x="40" y="192" class="cell-label"> 4K / 2K Resolutions</text>
  <text x="365" y="192" text-anchor="middle" class="cell-winner">✓ Yes 4K / 2K </text>
  <text x="595" y="192" text-anchor="middle" class="cell-bad">✕ No</text>
  <text x="825" y="192" text-anchor="middle" class="cell-value">Varies</text>

  <!-- Row 4: Lock Screen -->
  <text x="40" y="237" class="cell-label">Lock Screen Support</text>
  <text x="365" y="237" text-anchor="middle" class="cell-winner">✓ Yes (Desktop + Lock)</text>
  <text x="595" y="237" text-anchor="middle" class="cell-bad">✕ No</text>
  <text x="825" y="237" text-anchor="middle" class="cell-value">Rare</text>

  <!-- Row 5: Wallpaper Styles -->
  <text x="40" y="282" class="cell-label">Wallpaper Styles</text>
  <text x="365" y="282" text-anchor="middle" class="cell-winner">✓ Fit, Fill, Stretch, Tile</text>
  <text x="595" y="282" text-anchor="middle" class="cell-bad">✕ No</text>
  <text x="825" y="282" text-anchor="middle" class="cell-value">Rare</text>

  <!-- Row 6: Global Feeds -->
  <text x="40" y="327" class="cell-label">50+ Global Country Feeds</text>
  <text x="365" y="327" text-anchor="middle" class="cell-winner">✓ Yes (50+ Regions)</text>
  <text x="595" y="327" text-anchor="middle" class="cell-bad">✕ No (US only)</text>
  <text x="825" y="327" text-anchor="middle" class="cell-value">Rare</text>

  <!-- Row 7: Downloader -->
  <text x="40" y="372" class="cell-label">High-Res Local Downloader</text>
  <text x="365" y="372" text-anchor="middle" class="cell-winner">✓ Yes (1-Click Save)</text>
  <text x="595" y="372" text-anchor="middle" class="cell-bad">✕ No</text>
  <text x="825" y="372" text-anchor="middle" class="cell-value">Varies</text>

  <!-- Row 8: UI Framework -->
  <text x="40" y="417" class="cell-label">Modern Fluent UI &amp; Effects</text>
  <text x="365" y="417" text-anchor="middle" class="cell-winner">✓ Yes (Native WPF)</text>
  <text x="595" y="417" text-anchor="middle" class="cell-value">Outdated Win32</text>
  <text x="825" y="417" text-anchor="middle" class="cell-value">WebView / Heavy</text>

  <!-- Row 9: Updates -->
  <text x="40" y="462" class="cell-label">1-Click In-App Updates</text>
  <text x="365" y="462" text-anchor="middle" class="cell-winner">✓ Yes (SHA-256 Verified)</text>
  <text x="595" y="462" text-anchor="middle" class="cell-value">Proprietary</text>
  <text x="825" y="462" text-anchor="middle" class="cell-value">Large Re-downloads</text>

  <!-- Row 10: Automation -->
  <text x="40" y="507" class="cell-label">Background Automation</text>
  <text x="365" y="507" text-anchor="middle" class="cell-winner">✓ Task Scheduler</text>
  <text x="595" y="507" text-anchor="middle" class="cell-value">Tray Process</text>
  <text x="825" y="507" text-anchor="middle" class="cell-value">Node.js Process</text>

  <!-- Row 11: Binary -->
  <text x="40" y="552" class="cell-label">Single Portable Binary</text>
  <text x="365" y="552" text-anchor="middle" class="cell-winner">✓ Yes (Standalone EXE)</text>
  <text x="595" y="552" text-anchor="middle" class="cell-bad">✕ No (MSI required)</text>
  <text x="825" y="552" text-anchor="middle" class="cell-value">Large bundle</text>

</svg>
