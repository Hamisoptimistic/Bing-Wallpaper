name: Build and Auto-Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-Increment Version & Package
        id: build_step
        shell: powershell
        run: |
          .\scripts\Build-Release.ps1

      - name: Delete Previous Latest Release
        shell: bash
        run: |
          gh release delete latest --yes --cleanup-tag || echo "No existing 'latest' release to delete."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "AutoScape v${{ steps.build_step.outputs.version }} (Latest)"
          body: |
            ### 🚀 AutoScape Latest Build (v${{ steps.build_step.outputs.version }})
            Automatically built from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.

            #### 📦 Downloads
            - **[AutoScape.zip](https://github.com/${{ github.repository }}/releases/download/latest/AutoScape.zip)**
            - **[AutoScape.zip.sha256](https://github.com/${{ github.repository }}/releases/download/latest/AutoScape.zip.sha256)** (SHA-256 Checksum)

            SHA256: ${{ steps.build_step.outputs.hash }}

            #### ⚙️ Setup
            1. Extract the zip anywhere (keep all files together).
            2. Double-click `Setup.bat` (one-time only — creates your Desktop/Start Menu shortcut).
            3. Launch AutoScape from the shortcut it creates.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            AutoScape.zip
            AutoScape.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Versioned Tag Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "AutoScape ${{ github.ref_name }}"
          body: |
            ### 🚀 AutoScape Release (${{ github.ref_name }})
            Built from commit `${{ github.sha }}` on tag `${{ github.ref_name }}`.

            #### 📦 Downloads
            - **[AutoScape.zip](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AutoScape.zip)**
            - **[AutoScape.zip.sha256](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AutoScape.zip.sha256)**

            SHA256: ${{ steps.build_step.outputs.hash }}

            #### ⚙️ Setup
            1. Extract the zip anywhere (keep all files together).
            2. Double-click `Setup.bat` (one-time only — creates your Desktop/Start Menu shortcut).
            3. Launch AutoScape from the shortcut it creates.
          draft: false
          prerelease: false
          files: |
            AutoScape.zip
            AutoScape.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}