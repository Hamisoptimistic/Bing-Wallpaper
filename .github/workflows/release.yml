name: Build and Auto-Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-Increment Version & Compile
        id: build_step
        shell: powershell
        run: |
          .\scripts\Build-Release.ps1

      - name: Publish Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: "AutoScape v${{ steps.build_step.outputs.version }} (Latest)"
          body: |
            ### 🚀 AutoScape Latest Build (v${{ steps.build_step.outputs.version }})
            Automatically built from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.

            #### 📦 Downloads
            - **[AutoScape.exe](https://github.com/${{ github.repository }}/releases/download/latest/AutoScape.exe)** (Zero-console standalone launcher)
            - **[AutoScape.exe.sha256](https://github.com/${{ github.repository }}/releases/download/latest/AutoScape.exe.sha256)** (SHA-256 Checksum)
          draft: false
          prerelease: false
          make_latest: true
          files: |
            AutoScape.exe
            AutoScape.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Versioned Tag Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "AutoScape ${{ github.ref_name }}"
          body: |
            ### 🚀 AutoScape Release (${{ github.ref_name }})
            Built from commit `${{ github.sha }}` on tag `${{ github.ref_name }}`.

            #### 📦 Downloads
            - **[AutoScape.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AutoScape.exe)**
            - **[AutoScape.exe.sha256](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AutoScape.exe.sha256)**
          draft: false
          prerelease: false
          files: |
            AutoScape.exe
            AutoScape.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}