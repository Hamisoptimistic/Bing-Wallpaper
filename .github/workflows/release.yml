name: Build and Auto-Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile BingWallpaper.exe and Checksum
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\Create-Bing-App-Shortcut.ps1
          if (-not (Test-Path .\BingWallpaper.exe)) {
            throw "BingWallpaper.exe failed to compile"
          }
          if (-not (Test-Path .\BingWallpaper.exe.sha256)) {
            $hash = (Get-FileHash -LiteralPath .\BingWallpaper.exe -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath .\BingWallpaper.exe.sha256 -Value "$hash  BingWallpaper.exe" -Encoding ASCII
          }

      - name: Determine Version
        id: get_version
        shell: powershell
        run: |
          $uiContent = Get-Content -LiteralPath .\Bing-Wallpaper-UI.ps1 -Raw
          if ($uiContent -match '\$script:appVersion\s*=\s*\[Version\][''"]([^''"]+)[''"]') {
            $ver = $Matches[1]
          } else {
            $ver = "1.0.0"
          }
          Write-Output "App Version: $ver"
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Bing Wallpaper v${{ steps.get_version.outputs.version }} (Latest)"
          body: |
            ### 🚀 Bing Wallpaper Latest Build (v${{ steps.get_version.outputs.version }})
            Automatically built from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.

            #### 📦 Downloads
            - **[BingWallpaper.exe](https://github.com/${{ github.repository }}/releases/download/latest/BingWallpaper.exe)** (Zero-console standalone launcher)
            - **[BingWallpaper.exe.sha256](https://github.com/${{ github.repository }}/releases/download/latest/BingWallpaper.exe.sha256)** (SHA-256 Checksum)
          draft: false
          prerelease: false
          make_latest: true
          files: |
            BingWallpaper.exe
            BingWallpaper.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Versioned Tag Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Bing Wallpaper ${{ github.ref_name }}"
          body: |
            ### 🚀 Bing Wallpaper Release (${{ github.ref_name }})
            Built from commit `${{ github.sha }}` on tag `${{ github.ref_name }}`.

            #### 📦 Downloads
            - **[BingWallpaper.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/BingWallpaper.exe)**
            - **[BingWallpaper.exe.sha256](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/BingWallpaper.exe.sha256)**
          draft: false
          prerelease: false
          files: |
            BingWallpaper.exe
            BingWallpaper.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


